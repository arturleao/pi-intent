name: ICED validate
description: Lint ICED units (intent/*/iced.md) and fail on contract tampering or missing evidence.
inputs:
  strict:
    description: Also fail on warnings
    required: false
    default: "false"
  working-directory:
    description: Repository root that contains .iced/
    required: false
    default: "."
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: "20"
    - shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        if [ "${{ inputs.strict }}" = "true" ]; then STRICT=--strict; else STRICT=; fi
        node "${{ github.action_path }}/bin/iced.mjs" validate $STRICT
